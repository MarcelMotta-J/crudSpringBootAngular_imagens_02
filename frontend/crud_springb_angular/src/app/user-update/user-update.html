<div class="update-page">
    <div class="update-card">

        <div class="form-header">
            <h2>Edit User</h2>
            <p>Update the user information below.</p>
        </div>

        <form
            [formGroup]="userForm"
            (ngSubmit)="updateUser()"
            enctype="multipart/form-data">

            <div class="mb-3">
                <label for="first_name" class="form-label">
                    First Name
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="first_name"
                    formControlName="first_name">
            </div>

            <div class="mb-3">
                <label for="last_name" class="form-label">
                    Last Name
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="last_name"
                    formControlName="last_name">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    class="form-control"
                    id="email"
                    formControlName="email">
            </div>

            <div class="mb-3">
                <label for="cpf" class="form-label">
                    CPF
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="cpf"
                    formControlName="cpf"
                    maxlength="11"
                    inputmode="numeric"
                    placeholder="11 digits">

                <div
                    class="text-danger mt-1 validation-message"
                    *ngIf="userForm.get('cpf')?.touched &&
                           userForm.get('cpf')?.invalid">

                    CPF must contain exactly 11 digits.

                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">
                    New Password
                </label>

                <input
                    type="password"
                    class="form-control"
                    id="password"
                    formControlName="password"
                    placeholder="Leave blank to keep current password">

                <div class="form-text">
                    Leave blank if you do not want to change the password.
                </div>
            </div>

            <div class="mb-3">
                <label for="image" class="form-label">
                    Profile Image
                </label>

                <input
                    type="file"
                    class="form-control"
                    id="image"
                    (change)="onFileSelected($event)">

                <div class="form-text">
                    Choose a new image only if you want to replace the current one.
                </div>
            </div>

            @if (imagePreview) {
                <div class="image-preview">
                    <span class="preview-label">
                        Current / selected image
                    </span>

                    <img
                        [src]="imagePreview"
                        alt="User profile preview">
                </div>
            }

            @if (errorMessage) {
                <div class="alert alert-danger">
                    {{ errorMessage }}
                </div>
            }

            <div class="form-actions">
                <a
                    routerLink="/users"
                    class="btn btn-outline-secondary">
                    Cancel
                </a>

                <button
                    class="btn btn-primary"
                    type="submit"
                    [disabled]="userForm.invalid">
                    Save Changes
                </button>
            </div>

        </form>

    </div>
</div>
