<div class="login-container">

  <h2>Login</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

    <div>
      <label for="email">Email</label>

      <input
        id="email"
        type="email"
        formControlName="email"
      >
    </div>

    <div>
      <label for="password">Password</label>

      <input
        id="password"
        type="password"
        formControlName="password"
      >
    </div>

    <button
      type="submit"
      [disabled]="loginForm.invalid"
    >
      Login
    </button>

  </form>

  @if (errorMessage) {
    <p>{{ errorMessage }}</p>
  }

</div>
