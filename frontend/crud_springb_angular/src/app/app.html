@if (authService.isLoggedIn()) {
<header class="app-header">
    <div class="app-header__brand">
        CRUD Users
    </div>

    <div class="app-header__actions">
        <span class="logged-user">
            Logged in as: {{ authService.getEmail() }}
        </span>

        <button
            type="button"
            class="logout-button"
            (click)="logout()">
            Logout
        </button>
    </div>
</header>
}

<router-outlet />
